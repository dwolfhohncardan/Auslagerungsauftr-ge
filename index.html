<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraLog Pro - Voice Command v1.9.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s; }
        .tv-card-row { height: var(--tv-card-height, 60px) !important; }
        :root { --tv-font-size: 16px; --tv-gap: 8px; }
        #tv-grid { gap: var(--tv-gap) !important; }
        .status-error { animation: shake 0.5s ease-in-out infinite; border-color: #ef4444 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-black dark:text-zinc-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-zinc-800 bg-white dark:bg-black sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 p-2 rounded-lg text-white shadow-lg shadow-brand-500/30">
                    <i data-lucide="package" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">IntraLog Dashboard</h1>
                    <p class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Voice Control v1.9.5</p>
                </div>
            </div>

            <nav class="flex bg-slate-100 dark:bg-zinc-900 p-1 rounded-xl border border-slate-200 dark:border-zinc-800">
                <button id="btn-mode-operator" onclick="setViewMode('operator')" class="px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2"><i data-lucide="edit-3" class="w-4 h-4"></i> Bediener</button>
                <button id="btn-mode-tv" onclick="setViewMode('tv')" class="px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2"><i data-lucide="monitor" class="w-4 h-4"></i> TV</button>
                <button id="btn-mode-tablet" onclick="setViewMode('tablet')" class="px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2"><i data-lucide="tablet" class="w-4 h-4"></i> Tablet</button>
            </nav>
        </div>
    </header>

    <!-- BEDIENER ANSICHT -->
    <main id="view-operator" class="hidden flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Linke Spalte: Formular & Voice Settings -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Auftrag Formular -->
                <div class="bg-white dark:bg-zinc-950 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm">
                    <h2 class="text-xs font-black uppercase tracking-widest mb-6 text-brand-500">Neuer Auftrag</h2>
                    <form id="auftrag-form" class="space-y-4">
                        <input type="text" id="artikelnummer" required placeholder="Artikelnummer" class="w-full px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm font-mono outline-none">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="lagerort" required placeholder="Von" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm uppercase">
                            <input type="text" id="zielort" required placeholder="Nach" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm uppercase">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="time" id="uhrzeit" required class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm">
                            <select id="schicht" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm">
                                <option>Frühschicht</option><option>Spätschicht</option><option>Nachtschicht</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full py-4 bg-brand-500 text-white font-black rounded-xl hover:bg-brand-600 transition-all uppercase text-[10px]">Senden</button>
                    </form>
                </div>

                <!-- Voice Settings -->
                <div class="bg-white dark:bg-zinc-950 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm">
                    <h2 class="text-xs font-black uppercase tracking-widest mb-4 text-emerald-500 flex items-center justify-between">
                        Audio-Assistenz 
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="voice-active" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-zinc-800 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                        </label>
                    </h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">STIMME</label>
                            <select id="voice-gender" class="w-full p-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-lg text-xs font-bold">
                                <!-- Dynamisch befüllt -->
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">TONFALL</label>
                            <select id="voice-tone" class="w-full p-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-lg text-xs font-bold">
                                <option value="friendly">Freundlich (Zuvorkommend)</option>
                                <option value="unfriendly">Unfreundlich (Bestimmend)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 block mb-1">INTERVALL (Minuten)</label>
                            <input type="number" id="voice-interval" value="1" min="1" max="60" class="w-full p-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-lg text-xs font-bold">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rechte Spalte: Listen -->
            <div class="lg:col-span-3 space-y-6">
                <div class="bg-white dark:bg-zinc-950 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 dark:border-zinc-800 flex justify-between items-center bg-slate-50/50 dark:bg-zinc-900/50">
                        <h2 class="text-xs font-black uppercase tracking-widest flex items-center gap-2"><i data-lucide="play" class="w-3 h-3 text-brand-500"></i> Warteschlange</h2>
                        <div id="live-clock-operator" class="text-xs font-mono font-bold text-slate-400">00:00:00</div>
                    </div>
                    <table class="w-full text-left text-sm">
                        <tbody id="table-active" class="divide-y divide-slate-100 dark:divide-zinc-900"></tbody>
                    </table>
                </div>

                <div class="bg-white dark:bg-zinc-950 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden border-dashed">
                    <div class="px-6 py-4 border-b border-slate-200 dark:border-zinc-800 flex justify-between items-center">
                        <h2 class="text-xs font-black uppercase tracking-widest flex items-center gap-2 text-slate-500"><i data-lucide="archive" class="w-3 h-3"></i> Archiv</h2>
                        <input type="date" id="archive-date-filter" class="text-xs bg-slate-100 dark:bg-zinc-900 border-none rounded-lg p-1.5 font-bold">
                    </div>
                    <div class="max-h-[300px] overflow-y-auto">
                        <table class="w-full text-left text-xs">
                            <tbody id="table-archive" class="divide-y divide-slate-50 dark:divide-zinc-900 text-slate-500"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- TV ANSICHT -->
    <main id="view-tv" class="hidden flex-grow p-6 flex flex-col space-y-4">
        <div class="bg-white dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 p-5 rounded-2xl flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3"><div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div><span class="text-xl font-black tracking-tighter uppercase">Monitoring</span></div>
                <div class="flex gap-8 border-l pl-8 border-slate-200 dark:border-zinc-800">
                    <div class="text-center"><p class="text-[10px] font-bold text-slate-400">OFFEN</p><p id="tv-kpi-open" class="text-2xl font-black">0</p></div>
                    <div class="text-center"><p class="text-[10px] font-bold text-red-500">KRITISCH</p><p id="tv-kpi-error" class="text-2xl font-black text-red-500">0</p></div>
                </div>
            </div>
            <div id="tv-clock" class="text-3xl font-mono font-black tracking-tighter">00:00:00</div>
        </div>
        <div id="tv-grid" class="grid flex-grow auto-rows-max overflow-y-auto"></div>
    </main>

    <!-- TABLET ANSICHT -->
    <main id="view-tablet" class="hidden flex-grow p-4 flex flex-col space-y-4">
        <div class="bg-white dark:bg-zinc-950 p-4 rounded-2xl border border-slate-200 dark:border-zinc-800 flex justify-between items-center shadow-sm">
            <h2 class="font-black text-sm uppercase tracking-tighter flex items-center gap-2"><i data-lucide="scan" class="text-brand-500"></i> Scanner Terminal</h2>
            <div class="tablet-clock font-mono text-xs text-slate-500">00:00:00</div>
        </div>
        <div id="tablet-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow auto-rows-max"></div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] space-y-3"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmwKHhJ6df7yOoR_LPUvc5PD6-Shvs9t8",
            authDomain: "auslagerungsauftraege.firebaseapp.com",
            projectId: "auslagerungsauftraege",
            storageBucket: "auslagerungsauftraege.firebasestorage.app",
            messagingSenderId: "135148773877",
            appId: "1:135148773877:web:9bed592472c82e20b140bc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersCol = collection(db, "orders");

        // --- STATE ---
        let orders = [];
        let currentView = 'operator';
        let archiveDate = new Date().toISOString().split('T')[0];
        let lastVoiceAnnouncement = 0;

        // Voice Settings State
        let voiceSettings = JSON.parse(localStorage.getItem('voice_settings')) || {
            active: true,
            voiceName: '',
            tone: 'friendly',
            interval: 1
        };

        // --- SPEECH ENGINE ---
        const synth = window.speechSynthesis;
        let voices = [];

        function initVoices() {
            voices = synth.getVoices().filter(v => v.lang.startsWith('de'));
            const select = document.getElementById('voice-gender');
            if(!select) return;
            select.innerHTML = voices.map(v => `<option value="${v.name}">${v.name.includes('Stefan') || v.name.includes('Male') ? 'Männlich' : 'Weiblich'} (${v.name})</option>`).join('');
            
            if(voiceSettings.voiceName) select.value = voiceSettings.voiceName;
            else if(voices.length > 0) voiceSettings.voiceName = voices[0].name;
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        function speak(text) {
            if(!voiceSettings.active || synth.speaking) return;
            
            const utter = new SpeechSynthesisUtterance(text);
            const selectedVoice = voices.find(v => v.name === voiceSettings.voiceName);
            if(selectedVoice) utter.voice = selectedVoice;

            if(voiceSettings.tone === 'friendly') {
                utter.pitch = 1.2;
                utter.rate = 0.9;
            } else {
                utter.pitch = 0.6;
                utter.rate = 1.3;
            }
            synth.speak(utter);
        }

        // --- CORE NAVIGATION ---
        window.setViewMode = (mode) => {
            currentView = mode;
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById(`view-${mode}`).classList.remove('hidden');
            render();
        };

        window.cycleStatus = async (id, currentStatus) => {
            const docRef = doc(db, "orders", id);
            let update = currentStatus === 0 ? { status: 1, finishedAt: Timestamp.now() } : 
                         currentStatus === 1 ? { status: 2 } : { status: 0, finishedAt: null };
            await updateDoc(docRef, update);
        };

        // --- RENDER ---
        function render() {
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();

            const active = orders.filter(o => o.status !== 1).sort((a,b) => getMin(a.uhrzeit) - getMin(b.uhrzeit));
            const archived = orders.filter(o => o.status === 1 && o.finishedAt?.toDate().toISOString().split('T')[0] === archiveDate);

            if(currentView === 'operator') renderOperator(active, archived, nowMin);
            if(currentView === 'tv') renderTV(active, nowMin);
            if(currentView === 'tablet') renderTablet(active);

            checkOverdueVoice(active, nowMin);
            updateKPIs(active);
            lucide.createIcons();
        }

        function checkOverdueVoice(active, nowMin) {
            if(!voiceSettings.active) return;
            
            const overdue = active.filter(o => o.status === 0 && getMin(o.uhrzeit) < nowMin);
            const nowTs = Date.now();
            const intervalMs = voiceSettings.interval * 60000;

            if(overdue.length > 0 && (nowTs - lastVoiceAnnouncement > intervalMs)) {
                const oldest = overdue[0];
                const msg = `Die Auslagerung für ${oldest.uhrzeit} Uhr ist überfällig. Bitte sofort auslagern.`;
                speak(msg);
                lastVoiceAnnouncement = nowTs;
            }
        }

        function renderOperator(active, archived, nowMin) {
            document.getElementById('table-active').innerHTML = active.map(o => `
                <tr class="${o.status === 2 ? 'bg-red-50 dark:bg-red-900/10' : ''}">
                    <td class="px-6 py-4 font-mono font-bold">${esc(o.artikelnummer)}</td>
                    <td class="px-6 py-4 text-xs font-bold uppercase">${esc(o.lagerort)} ➔ ${esc(o.zielort)}</td>
                    <td class="px-6 py-4 font-bold ${getMin(o.uhrzeit) < nowMin ? 'text-amber-500' : ''}">${o.uhrzeit}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="cycleStatus('${o.id}', ${o.status})" class="p-2 bg-slate-100 dark:bg-zinc-800 rounded-lg hover:bg-emerald-500 hover:text-white transition-all"><i data-lucide="check" class="w-4 h-4"></i></button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('table-archive').innerHTML = archived.map(o => `
                <tr>
                    <td class="px-6 py-3 font-mono">${esc(o.artikelnummer)}</td>
                    <td class="px-6 py-3">${o.finishedAt.toDate().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})}</td>
                    <td class="px-6 py-3 text-right"><button onclick="cycleStatus('${o.id}', 1)" class="text-slate-400 hover:text-brand-500"><i data-lucide="refresh-cw" class="w-3 h-3"></i></button></td>
                </tr>
            `).join('');
        }

        function renderTV(active, nowMin) {
            document.getElementById('tv-grid').innerHTML = active.map(o => {
                const isLate = getMin(o.uhrzeit) < nowMin;
                return `
                <div class="tv-card-row flex items-center border-2 rounded-2xl mb-2 bg-white dark:bg-zinc-950 ${o.status === 2 ? 'border-red-500 animate-pulse' : 'border-slate-200 dark:border-zinc-800'}">
                    <div class="w-3 h-full ${o.status === 2 ? 'bg-red-500' : isLate ? 'bg-amber-500' : 'bg-slate-300'}"></div>
                    <div class="flex-grow flex items-center justify-between px-6 font-black">
                        <div class="text-xl font-mono">${esc(o.artikelnummer)}</div>
                        <div class="text-lg">${esc(o.lagerort)} <i data-lucide="chevrons-right" class="inline w-6 h-6"></i> ${esc(o.zielort)}</div>
                        <div class="text-xl">${o.uhrzeit}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderTablet(active) {
            document.getElementById('tablet-grid').innerHTML = active.map(o => `
                <div class="bg-white dark:bg-zinc-950 p-4 rounded-2xl border-2 border-slate-200 dark:border-zinc-800 flex items-center justify-between h-32">
                    <svg class="barcode-svg" data-value="${o.artikelnummer}"></svg>
                    <div class="text-center">
                        <p class="font-black">${esc(o.lagerort)} ➔ ${esc(o.zielort)}</p>
                        <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">${esc(o.schicht)} | ${o.uhrzeit}</p>
                    </div>
                    <button onclick="cycleStatus('${o.id}', ${o.status})" class="w-16 h-16 bg-emerald-500 text-white rounded-2xl flex items-center justify-center shadow-lg"><i data-lucide="check" class="w-8 h-8 stroke-[3]"></i></button>
                </div>
            `).join('');
            document.querySelectorAll('.barcode-svg').forEach(el => JsBarcode(el, el.getAttribute('data-value'), { format: "CODE128", width: 1.5, height: 50, displayValue: true, fontSize: 12, margin: 0 }));
        }

        // --- UTILS ---
        function getMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function updateKPIs(active) {
            const open = active.filter(o => o.status === 0).length;
            const err = active.filter(o => o.status === 2).length;
            ['kpi-open', 'tv-kpi-open'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).textContent = open; });
            ['kpi-urgent', 'tv-kpi-error'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).textContent = err; });
        }

        // --- EVENT LISTENERS ---
        onSnapshot(query(ordersCol, orderBy("createdAt", "desc")), (snap) => {
            orders = [];
            snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
            render();
        });

        document.getElementById('auftrag-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(ordersCol, {
                artikelnummer: document.getElementById('artikelnummer').value.trim(),
                lagerort: document.getElementById('lagerort').value.trim().toUpperCase(),
                zielort: document.getElementById('zielort').value.trim().toUpperCase(),
                uhrzeit: document.getElementById('uhrzeit').value,
                schicht: document.getElementById('schicht').value,
                dringlich: document.getElementById('dringlich').checked,
                status: 0,
                createdAt: Timestamp.now()
            });
            e.target.reset();
            const n = new Date();
            document.getElementById('uhrzeit').value = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
        });

        // Voice Settings Listeners
        document.getElementById('voice-active').addEventListener('change', (e) => { voiceSettings.active = e.target.checked; saveVoice(); });
        document.getElementById('voice-gender').addEventListener('change', (e) => { voiceSettings.voiceName = e.target.value; saveVoice(); speak("Stimme aktualisiert."); });
        document.getElementById('voice-tone').addEventListener('change', (e) => { voiceSettings.tone = e.target.value; saveVoice(); speak(voiceSettings.tone === 'friendly' ? "Ich bin jetzt freundlich." : "Ich habe jetzt schlechte Laune."); });
        document.getElementById('voice-interval').addEventListener('change', (e) => { voiceSettings.interval = e.target.value; saveVoice(); });

        function saveVoice() { localStorage.setItem('voice_settings', JSON.stringify(voiceSettings)); }

        setInterval(() => {
            const time = new Date().toLocaleTimeString('de-DE');
            ['live-clock-operator', 'tv-clock', '.tablet-clock'].forEach(sel => {
                const el = sel.startsWith('.') ? document.querySelector(sel) : document.getElementById(sel);
                if(el) el.textContent = time;
            });
            if(new Date().getSeconds() === 0) render();
        }, 1000);

        initVoices();
        setViewMode('operator');
    </script>
</body>
</html>
