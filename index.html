<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraLog Pro - Auslagerungen v1.9.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s; }
        .tv-card-row { height: var(--tv-card-height, 60px) !important; }
        :root { --tv-font-size: 16px; --tv-gap: 8px; }
        #tv-grid { gap: var(--tv-gap) !important; }
        .status-open { }
        .status-done { opacity: 0.6; filter: grayscale(0.5); }
        .status-error { animation: shake 0.5s ease-in-out infinite; border-color: #ef4444 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-black dark:text-zinc-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-zinc-800 bg-white dark:bg-black sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 p-2 rounded-lg text-white shadow-lg shadow-brand-500/30">
                    <i data-lucide="package" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">IntraLog Dashboard</h1>
                    <p class="text-[10px] text-slate-500 font-mono uppercase tracking-widest">Version 1.9.0 SP1</p>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <nav class="flex bg-slate-100 dark:bg-zinc-900 p-1 rounded-xl border border-slate-200 dark:border-zinc-800">
                    <button id="btn-mode-operator" onclick="setViewMode('operator')" class="px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Bediener
                    </button>
                    <button id="btn-mode-tv" onclick="setViewMode('tv')" class="px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2">
                        <i data-lucide="monitor" class="w-4 h-4"></i> TV-Ansicht
                    </button>
                    <button id="btn-mode-tablet" onclick="setViewMode('tablet')" class="px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2">
                        <i data-lucide="tablet" class="w-4 h-4"></i> Tablet
                    </button>
                </nav>
                <button id="theme-toggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-zinc-800 hover:bg-slate-100 dark:hover:bg-zinc-900">
                    <i data-lucide="sun" class="w-5 h-5 dark:hidden text-amber-500"></i>
                    <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-blue-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 1. BEDIENER ANSICHT -->
    <main id="view-operator" class="hidden flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
        <!-- KPI & Form Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white dark:bg-zinc-950 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm">
                    <h2 class="text-sm font-black uppercase tracking-widest mb-6 text-brand-500 flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Neuer Auftrag
                    </h2>
                    <form id="auftrag-form" class="space-y-4">
                        <div class="grid grid-cols-1 gap-4">
                            <input type="text" id="artikelnummer" required placeholder="Artikelnummer" class="w-full px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm font-mono focus:ring-2 focus:ring-brand-500 outline-none">
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="lagerort" required placeholder="Von" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm uppercase">
                                <input type="text" id="zielort" required placeholder="Nach" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm uppercase">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <input type="time" id="uhrzeit" required class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm">
                                <select id="schicht" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm">
                                    <option>Frühschicht</option><option>Spätschicht</option><option>Nachtschicht</option>
                                </select>
                            </div>
                        </div>
                        <label class="flex items-center p-3 bg-slate-50 dark:bg-zinc-900 rounded-xl cursor-pointer border border-transparent hover:border-red-500/30 transition-all">
                            <input type="checkbox" id="dringlich" class="w-5 h-5 accent-red-500 rounded">
                            <span class="ml-3 text-sm font-bold text-slate-600 dark:text-zinc-400">Hohe Priorität</span>
                        </button>
                        <button type="submit" class="w-full py-4 bg-brand-500 text-white font-black rounded-xl hover:bg-brand-600 shadow-lg shadow-brand-500/20 transition-all uppercase tracking-widest text-xs">Auftrag Senden</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-8">
                <!-- Aktive Aufträge -->
                <div class="bg-white dark:bg-zinc-950 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 dark:border-zinc-800 flex justify-between items-center bg-slate-50/50 dark:bg-zinc-900/50">
                        <h2 class="text-xs font-black uppercase tracking-widest flex items-center gap-2"><i data-lucide="play" class="w-3 h-3 text-brand-500"></i> Aktive Warteschlange</h2>
                        <div id="live-clock-operator" class="text-xs font-mono font-bold text-slate-400">00:00:00</div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <tbody id="table-active" class="divide-y divide-slate-100 dark:divide-zinc-900"></tbody>
                        </table>
                        <div id="active-empty" class="p-12 text-center text-slate-400 text-xs italic hidden">Aktuell keine aktiven Aufträge</div>
                    </div>
                </div>

                <!-- Archiv Sektion -->
                <div class="bg-white dark:bg-zinc-950 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden border-dashed">
                    <div class="px-6 py-4 border-b border-slate-200 dark:border-zinc-800 flex justify-between items-center">
                        <h2 class="text-xs font-black uppercase tracking-widest flex items-center gap-2 text-slate-500"><i data-lucide="archive" class="w-3 h-3"></i> Archiv / Erledigt</h2>
                        <input type="date" id="archive-date-filter" class="text-xs bg-slate-100 dark:bg-zinc-900 border-none rounded-lg p-1.5 font-bold">
                    </div>
                    <div class="max-h-[300px] overflow-y-auto">
                        <table class="w-full text-left text-xs">
                            <tbody id="table-archive" class="divide-y divide-slate-50 dark:divide-zinc-900 text-slate-500"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 2. TV ANSICHT -->
    <main id="view-tv" class="hidden flex-grow p-6 flex flex-col space-y-4">
        <div class="bg-white dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 p-5 rounded-2xl flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span class="text-xl font-black tracking-tighter uppercase">Live Monitoring</span>
                </div>
                <div class="h-8 w-px bg-slate-200 dark:bg-zinc-800"></div>
                <div class="flex gap-8">
                    <div class="text-center"><p class="text-[10px] font-bold text-slate-400 uppercase">Offen</p><p id="tv-kpi-open" class="text-2xl font-black">0</p></div>
                    <div class="text-center"><p class="text-[10px] font-bold text-red-500 uppercase">Störung</p><p id="tv-kpi-error" class="text-2xl font-black text-red-500">0</p></div>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div id="tv-clock" class="text-3xl font-mono font-black tracking-tighter">00:00:00</div>
                <button id="tv-settings-toggle" class="p-2 border rounded-xl hover:bg-slate-100 dark:hover:bg-zinc-900"><i data-lucide="sliders" class="w-5 h-5"></i></button>
            </div>
        </div>
        
        <div id="tv-settings-panel" class="hidden bg-white dark:bg-zinc-950 p-4 rounded-xl border border-slate-200 dark:border-zinc-800 grid grid-cols-4 gap-6 animate-in slide-in-from-top-4 duration-300">
            <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase">Zeilenhöhe</label><input type="range" id="input-height" min="50" max="150" value="70" class="w-full accent-brand-500"></div>
            <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase">Schrift</label><input type="range" id="input-font" min="14" max="32" value="18" class="w-full accent-brand-500"></div>
            <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase">Abstand</label><input type="range" id="input-gap" min="4" max="40" value="10" class="w-full accent-brand-500"></div>
            <div class="space-y-1"><label class="text-[10px] font-black text-slate-400 uppercase">Spalten</label><select id="input-columns" class="w-full p-2 bg-slate-50 dark:bg-zinc-900 border-none rounded-lg text-xs font-bold"><option value="auto">Auto</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></div>
        </div>

        <div id="tv-grid" class="grid flex-grow auto-rows-max overflow-y-auto"></div>
    </main>

    <!-- 3. TABLET ANSICHT -->
    <main id="view-tablet" class="hidden flex-grow p-4 flex flex-col space-y-4">
        <div class="bg-white dark:bg-zinc-950 p-4 rounded-2xl border border-slate-200 dark:border-zinc-800 flex justify-between items-center shadow-sm">
            <h2 class="font-black text-sm uppercase tracking-tighter flex items-center gap-2"><i data-lucide="scan" class="text-brand-500"></i> Scanner Terminal</h2>
            <div class="flex gap-2">
                 <button onclick="toggleTabletArchive()" id="btn-tablet-archive" class="px-4 py-2 bg-slate-100 dark:bg-zinc-900 rounded-xl text-[10px] font-black uppercase">Archiv anzeigen</button>
            </div>
        </div>
        
        <div id="tablet-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow auto-rows-max"></div>
        <div id="tablet-archive-section" class="hidden space-y-4">
            <div class="text-[10px] font-black uppercase text-slate-400">Erledigte Aufträge (Heute)</div>
            <div id="tablet-archive-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 opacity-60"></div>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] space-y-3"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmwKHhJ6df7yOoR_LPUvc5PD6-Shvs9t8",
            authDomain: "auslagerungsauftraege.firebaseapp.com",
            projectId: "auslagerungsauftraege",
            storageBucket: "auslagerungsauftraege.firebasestorage.app",
            messagingSenderId: "135148773877",
            appId: "1:135148773877:web:9bed592472c82e20b140bc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersCol = collection(db, "orders");

        // --- STATE ---
        let orders = [];
        let view = 'operator';
        let showTabletArchive = false;
        let archiveDate = new Date().toISOString().split('T')[0];
        let tvSettings = JSON.parse(localStorage.getItem('tv_settings_pro')) || { height: 75, font: 18, gap: 12, cols: 'auto' };

        // --- CORE LOGIC ---
        window.setViewMode = (mode) => {
            view = mode;
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById(`view-${mode}`).classList.remove('hidden');
            
            document.querySelectorAll('nav button').forEach(b => {
                const isActive = b.id === `btn-mode-${mode}`;
                b.className = `px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-2 ${isActive ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/30' : 'text-slate-500 dark:text-zinc-400 hover:bg-slate-200 dark:hover:bg-zinc-800'}`;
            });
            render();
        };

        // Status Management: 0 = offen, 1 = erledigt, 2 = störung
        window.cycleStatus = async (id, currentStatus) => {
            const docRef = doc(db, "orders", id);
            let nextStatus = 0;
            let updateData = {};

            if (currentStatus === 0) {
                nextStatus = 1;
                updateData = { status: 1, finishedAt: Timestamp.now() };
                showToast("Auftrag als ERLEDIGT markiert", "success");
            } else if (currentStatus === 1) {
                nextStatus = 2;
                updateData = { status: 2 };
                showToast("STÖRUNG gemeldet!", "error");
            } else {
                nextStatus = 0;
                updateData = { status: 0, finishedAt: null };
                showToast("Auftrag wieder GEÖFFNET");
            }

            try {
                await updateDoc(docRef, updateData);
            } catch (e) {
                showToast("Fehler beim Status-Update", "error");
            }
        };

        // --- RENDERING ---
        function render() {
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();

            // Filterung
            const activeOrders = orders.filter(o => o.status !== 1).sort((a,b) => {
                if(a.dringlich !== b.dringlich) return b.dringlich ? 1 : -1;
                if(a.status === 2 && b.status !== 2) return -1;
                if(a.status !== 2 && b.status === 2) return 1;
                return getMin(a.uhrzeit) - getMin(b.uhrzeit);
            });

            const archivedOrders = orders.filter(o => {
                if (o.status !== 1 || !o.finishedAt) return false;
                const d = o.finishedAt.toDate().toISOString().split('T')[0];
                return d === archiveDate;
            }).sort((a,b) => b.finishedAt - a.finishedAt);

            if(view === 'operator') renderOperator(activeOrders, archivedOrders, nowMin);
            if(view === 'tv') renderTV(activeOrders, nowMin);
            if(view === 'tablet') renderTablet(activeOrders, archivedOrders, nowMin);

            updateKPIs(activeOrders);
            lucide.createIcons();
        }

        function renderOperator(active, archived, nowMin) {
            const activeTable = document.getElementById('table-active');
            activeTable.innerHTML = active.map(o => `
                <tr class="group hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors ${o.status === 2 ? 'bg-red-50/50 dark:bg-red-900/10' : ''}">
                    <td class="px-6 py-4 font-mono font-black text-sm">${esc(o.artikelnummer)}</td>
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-tight">
                            <span class="bg-slate-100 dark:bg-zinc-800 px-2 py-1 rounded text-slate-500">${esc(o.lagerort)}</span>
                            <i data-lucide="arrow-right" class="w-3 h-3 text-slate-300"></i>
                            <span class="bg-brand-50 dark:bg-brand-900/30 text-brand-600 px-2 py-1 rounded">${esc(o.zielort)}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-xs font-bold ${getMin(o.uhrzeit) < nowMin ? 'text-amber-500' : ''}">${o.uhrzeit}</td>
                    <td class="px-6 py-4">
                        ${o.status === 2 ? '<span class="px-2 py-1 bg-red-500 text-white text-[8px] font-black rounded uppercase animate-pulse">Störung</span>' : 
                          o.dringlich ? '<span class="px-2 py-1 bg-red-100 dark:bg-red-900/30 text-red-600 text-[8px] font-black rounded uppercase">Express</span>' : 
                          '<span class="text-slate-400 text-[8px] font-bold uppercase">Geplant</span>'}
                    </td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="cycleStatus('${o.id}', ${o.status})" class="p-2 rounded-lg bg-slate-100 dark:bg-zinc-800 hover:bg-emerald-500 hover:text-white transition-all">
                            <i data-lucide="check" class="w-4 h-4"></i>
                        </button>
                    </td>
                </tr>
            `).join('');

            const archiveTable = document.getElementById('table-archive');
            archiveTable.innerHTML = archived.map(o => `
                <tr>
                    <td class="px-6 py-3 font-mono">${esc(o.artikelnummer)}</td>
                    <td class="px-6 py-3">${esc(o.lagerort)} ➔ ${esc(o.zielort)}</td>
                    <td class="px-6 py-3 text-[10px]">${o.finishedAt.toDate().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})} Uhr</td>
                    <td class="px-6 py-3 text-right">
                        <button onclick="cycleStatus('${o.id}', 1)" class="text-slate-400 hover:text-brand-500"><i data-lucide="refresh-cw" class="w-3 h-3"></i></button>
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('active-empty').classList.toggle('hidden', active.length > 0);
        }

        function renderTV(active, nowMin) {
            const grid = document.getElementById('tv-grid');
            grid.innerHTML = active.map(o => {
                const isLate = getMin(o.uhrzeit) < nowMin && o.status === 0;
                const statusClass = o.status === 2 ? 'border-red-500 bg-red-50 dark:bg-red-900/10 shadow-lg shadow-red-500/20' : 
                                   o.dringlich ? 'border-brand-500/50 bg-white dark:bg-zinc-950 shadow-brand-500/10' : 'border-slate-200 dark:border-zinc-800 bg-white dark:bg-zinc-950';
                
                return `
                <div class="tv-card-row flex items-center border-2 rounded-2xl overflow-hidden transition-all duration-500 ${statusClass}">
                    <div class="w-3 h-full ${o.status === 2 ? 'bg-red-500' : o.dringlich ? 'bg-brand-500' : isLate ? 'bg-amber-500' : 'bg-slate-300'}"></div>
                    <div class="flex-grow flex items-center justify-between px-6">
                        <div class="w-1/4">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Artikel</p>
                            <p class="font-mono font-black" style="font-size: ${tvSettings.font}px">${esc(o.artikelnummer)}</p>
                        </div>
                        <div class="flex-grow flex items-center justify-center gap-6">
                            <div class="flex items-center gap-3">
                                <span class="bg-slate-100 dark:bg-zinc-900 px-3 py-1.5 rounded-xl font-black" style="font-size: ${tvSettings.font*0.7}px">${esc(o.lagerort)}</span>
                                <i data-lucide="chevrons-right" class="w-5 h-5 text-slate-300"></i>
                                <span class="bg-emerald-500 text-white px-3 py-1.5 rounded-xl font-black" style="font-size: ${tvSettings.font*0.7}px">${esc(o.zielort)}</span>
                            </div>
                        </div>
                        <div class="text-right w-1/4">
                            <p class="font-mono font-black" style="font-size: ${tvSettings.font}px">${o.uhrzeit}</p>
                            <p class="text-[10px] font-black uppercase ${o.status === 2 ? 'text-red-500' : 'text-slate-400'}">
                                ${o.status === 2 ? '!! STÖRUNG !!' : o.dringlich ? 'EXPRESS' : isLate ? 'ÜBERFÄLLIG' : 'GEPLANT'}
                            </p>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderTablet(active, archived, nowMin) {
            const grid = document.getElementById('tablet-grid');
            grid.innerHTML = active.map(o => `
                <div class="bg-white dark:bg-zinc-950 border-2 ${o.status === 2 ? 'border-red-500' : 'border-slate-200 dark:border-zinc-800'} p-4 rounded-2xl flex items-center justify-between shadow-sm h-32">
                    <div class="bg-white p-2 rounded-xl border-2 border-slate-100 shrink-0"><svg class="barcode-svg" data-value="${o.artikelnummer}"></svg></div>
                    <div class="flex flex-col items-center flex-grow px-2">
                        <div class="flex items-center gap-2 font-black text-sm">
                            <span class="text-slate-400">${esc(o.lagerort)}</span>
                            <i data-lucide="arrow-right-circle" class="w-4 h-4 text-brand-500"></i>
                            <span class="text-emerald-500">${esc(o.zielort)}</span>
                        </div>
                        <div class="text-[9px] font-black uppercase mt-2 px-2 py-0.5 bg-slate-100 dark:bg-zinc-900 rounded">${esc(o.schicht)} | ${o.uhrzeit}</div>
                    </div>
                    <button onclick="cycleStatus('${o.id}', ${o.status})" class="w-16 h-16 ${o.status === 2 ? 'bg-red-500' : 'bg-emerald-500'} text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all">
                        <i data-lucide="${o.status === 2 ? 'alert-octagon' : 'check'}" class="w-8 h-8 stroke-[3]"></i>
                    </button>
                </div>
            `).join('');

            const archGrid = document.getElementById('tablet-archive-grid');
            archGrid.innerHTML = archived.map(o => `
                <div class="bg-slate-100 dark:bg-zinc-900/50 p-3 rounded-xl flex justify-between items-center text-xs">
                    <span class="font-mono font-bold">${esc(o.artikelnummer)}</span>
                    <span class="text-[10px] uppercase font-bold">${esc(o.lagerort)} ➔ ${esc(o.zielort)}</span>
                    <button onclick="cycleStatus('${o.id}', 1)" class="p-1 hover:text-brand-500"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
                </div>
            `).join('');

            document.querySelectorAll('.barcode-svg').forEach(el => {
                JsBarcode(el, el.getAttribute('data-value'), { format: "CODE128", width: 1.5, height: 50, displayValue: true, fontSize: 12, margin: 0 });
            });
        }

        // --- UTILS & EVENTS ---
        function getMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            const color = type === 'success' ? 'bg-emerald-500' : type === 'error' ? 'bg-red-500' : 'bg-slate-800';
            t.className = `${color} text-white px-6 py-3 rounded-2xl shadow-2xl text-xs font-black uppercase tracking-widest animate-in slide-in-from-right-10 duration-300`;
            t.textContent = msg;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => { t.classList.add('opacity-0'); setTimeout(() => t.remove(), 500); }, 3000);
        }

        function updateKPIs(active) {
            const open = active.filter(o => o.status === 0).length;
            const error = active.filter(o => o.status === 2).length;
            ['kpi-open', 'tv-kpi-open'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).textContent = open; });
            ['kpi-urgent', 'tv-kpi-error'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).textContent = error; });
        }

        // --- FIREBASE SYNC ---
        onSnapshot(query(ordersCol, orderBy("createdAt", "desc")), (snap) => {
            orders = [];
            snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
            render();
        });

        document.getElementById('auftrag-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;

            try {
                await addDoc(ordersCol, {
                    artikelnummer: document.getElementById('artikelnummer').value.trim(),
                    lagerort: document.getElementById('lagerort').value.trim().toUpperCase(),
                    zielort: document.getElementById('zielort').value.trim().toUpperCase(),
                    uhrzeit: document.getElementById('uhrzeit').value,
                    schicht: document.getElementById('schicht').value,
                    dringlich: document.getElementById('dringlich').checked,
                    status: 0,
                    createdAt: Timestamp.now()
                });
                showToast("Auftrag erfolgreich eingereicht", "success");
                e.target.reset();
                initTime();
            } catch (err) { showToast("Speicherfehler!", "error"); }
            btn.disabled = false;
        });

        // Archive Filter Change
        document.getElementById('archive-date-filter').addEventListener('change', (e) => {
            archiveDate = e.target.value;
            render();
        });

        window.toggleTabletArchive = () => {
            showTabletArchive = !showTabletArchive;
            document.getElementById('tablet-archive-section').classList.toggle('hidden', !showTabletArchive);
            document.getElementById('btn-tablet-archive').textContent = showTabletArchive ? "Archiv ausblenden" : "Archiv anzeigen";
            render();
        };

        // --- UI INITIALIZATION ---
        function initTime() {
            const n = new Date();
            document.getElementById('uhrzeit').value = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
            document.getElementById('archive-date-filter').value = archiveDate;
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });

        // TV Settings Listeners
        document.getElementById('tv-settings-toggle').addEventListener('click', () => document.getElementById('tv-settings-panel').classList.toggle('hidden'));
        ['height', 'font', 'gap'].forEach(key => {
            document.getElementById(`input-${key}`).addEventListener('input', (e) => {
                tvSettings[key] = e.target.value;
                applyTVSettings();
            });
        });
        document.getElementById('input-columns').addEventListener('change', (e) => {
            tvSettings.cols = e.target.value;
            applyTVSettings();
        });

        function applyTVSettings() {
            document.documentElement.style.setProperty('--tv-card-height', `${tvSettings.height}px`);
            document.documentElement.style.setProperty('--tv-gap', `${tvSettings.gap}px`);
            const grid = document.getElementById('tv-grid');
            grid.className = `grid flex-grow auto-rows-max ${tvSettings.cols === 'auto' ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' : 'grid-cols-'+tvSettings.cols}`;
            localStorage.setItem('tv_settings_pro', JSON.stringify(tvSettings));
        }

        setInterval(() => {
            const time = new Date().toLocaleTimeString('de-DE');
            ['live-clock-operator', 'tv-clock', '.tablet-clock'].forEach(sel => {
                const el = sel.startsWith('.') ? document.querySelector(sel) : document.getElementById(sel);
                if(el) el.textContent = time;
            });
            if(new Date().getSeconds() === 0) render();
        }, 1000);

        // Bootstrap
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.remove('dark');
        initTime();
        applyTVSettings();
        setViewMode('operator');
    </script>
</body>
</html>
