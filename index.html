<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntraLog Pro - Neural Voice v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --tv-card-height: 85px;
            --tv-font-scale: 1.0;
            --tablet-cols: 2;
            --tablet-card-height: 160px;
            --tablet-font-scale: 1.0;
        }
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .tv-card-row { height: var(--tv-card-height, 85px) !important; }
        .glow-error { box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.98); opacity: 0.8; } }
        .voice-active-ui { animation: pulse-emerald 1s infinite; background: #10b981 !important; color: white !important; }
        @keyframes pulse-emerald { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-black dark:text-zinc-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-zinc-800 bg-white dark:bg-black sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-600 p-2 rounded-lg text-white shadow-lg">
                    <i data-lucide="radio" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg tracking-tight uppercase">IntraLog Neural</h1>
                    <p class="text-[10px] text-emerald-500 font-mono font-bold uppercase tracking-widest">Acoustic Engine v2.1</p>
                </div>
            </div>

            <nav class="flex bg-slate-100 dark:bg-zinc-900 p-1 rounded-xl border border-slate-200 dark:border-zinc-800">
                <button id="btn-mode-operator" onclick="setViewMode('operator')" class="px-5 py-2 rounded-lg text-xs font-black uppercase transition-all">Bediener</button>
                <button id="btn-mode-tv" onclick="setViewMode('tv')" class="px-5 py-2 rounded-lg text-xs font-black uppercase transition-all">TV-Halle</button>
                <button id="btn-mode-tablet" onclick="setViewMode('tablet')" class="px-5 py-2 rounded-lg text-xs font-black uppercase transition-all">Tablet</button>
            </nav>
        </div>
    </header>

    <!-- BEDIENER ANSICHT -->
    <main id="view-operator" class="hidden flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <!-- Erfassung -->
                <div class="bg-white dark:bg-zinc-950 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm">
                    <h2 class="text-[10px] font-black uppercase tracking-widest mb-6 text-brand-500">Auftragserfassung</h2>
                    <form id="auftrag-form" class="space-y-4">
                        <input type="text" id="artikelnummer" required placeholder="Artikelnummer" class="w-full px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-brand-500">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="lagerort" required placeholder="VON" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm font-bold uppercase">
                            <input type="text" id="zielort" required placeholder="NACH" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm font-bold uppercase">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="time" id="uhrzeit" required class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm font-bold">
                            <select id="schicht" class="px-4 py-3 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-xl text-sm font-bold">
                                <option>Frühschicht</option><option>Spätschicht</option><option>Nachtschicht</option>
                            </select>
                        </div>
                        <!-- Dringlich Checkbox -->
                        <div class="flex items-center space-x-2 py-1">
                            <input type="checkbox" id="dringlich" class="w-4 h-4 rounded border-slate-200 dark:border-zinc-800 text-brand-600 focus:ring-brand-500 accent-brand-600">
                            <label for="dringlich" class="text-[10px] font-black uppercase tracking-wider text-slate-500 dark:text-zinc-400 cursor-pointer select-none">🚨 Hohe Priorität (Eilt)</label>
                        </div>
                        <button type="submit" id="btn-submit" class="w-full py-4 bg-brand-600 text-white font-black rounded-xl hover:bg-brand-700 transition-all uppercase text-[10px] tracking-widest shadow-lg">Auftrag Senden</button>
                    </form>
                </div>

                <!-- Voice Config Pro -->
                <div class="bg-white dark:bg-zinc-950 p-6 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm border-l-4 border-l-emerald-500">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[10px] font-black uppercase tracking-widest text-emerald-500">Acoustic Setup</h2>
                        <input type="checkbox" id="voice-active" class="w-4 h-4 accent-emerald-500" checked>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[9px] font-black text-slate-400 block mb-1">KI-STIMME (GOOGLE/NEURAL)</label>
                            <select id="voice-gender" class="w-full p-2 bg-slate-50 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 rounded-lg text-[10px] font-bold outline-none"></select>
                        </div>
                        <div>
                            <label class="text-[9px] font-black text-slate-400 block mb-1">HALL-INTENSITÄT (REVERB)</label>
                            <input type="range" id="voice-reverb" min="0" max="100" value="40" class="w-full accent-emerald-500">
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-zinc-900">
                            <label class="text-[10px] font-bold text-slate-400">INTERVAL (MIN)</label>
                            <input type="number" id="voice-interval" value="2" min="1" class="w-12 p-1 bg-slate-100 dark:bg-zinc-900 rounded text-xs font-bold text-center">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Warteschlange -->
            <div class="lg:col-span-3 space-y-6">
                <div class="bg-white dark:bg-zinc-950 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-200 dark:border-zinc-800 flex justify-between items-center bg-slate-50/50 dark:bg-zinc-900/50">
                        <h2 class="text-[10px] font-black uppercase tracking-widest flex items-center gap-2 text-slate-500"><i data-lucide="layout-list" class="w-3 h-3"></i> Warteschlange</h2>
                        <div id="live-clock-operator" class="text-xs font-mono font-bold text-brand-500 uppercase tracking-tighter">00:00:00</div>
                    </div>
                    <table class="w-full text-left">
                        <tbody id="table-active" class="divide-y divide-slate-100 dark:divide-zinc-900"></tbody>
                    </table>
                </div>

                <div class="bg-white dark:bg-zinc-950 rounded-2xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden border-dashed p-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 italic">Archiv</h2>
                        <input type="date" id="archive-date-filter" class="text-[10px] bg-slate-100 dark:bg-zinc-900 rounded p-1 font-bold outline-none border-none">
                    </div>
                    <table class="w-full text-left text-[10px] text-slate-500 mt-2">
                        <tbody id="table-archive" class="divide-y divide-slate-50 dark:divide-zinc-900"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- TV MONITOR -->
    <main id="view-tv" class="hidden flex-grow p-6 flex flex-col space-y-4">
        <div class="bg-white dark:bg-zinc-950 border-4 border-slate-100 dark:border-zinc-900 p-8 rounded-[40px] flex items-center justify-between shadow-2xl">
            <div class="flex items-center gap-12">
                <span class="text-4xl font-black uppercase tracking-tighter text-brand-600">Hallen-Monitor</span>
                <div class="flex gap-12 border-l-4 pl-12 border-slate-100 dark:border-zinc-900 font-black">
                    <div class="text-center"><p class="text-[12px] text-slate-400 mb-1">OFFEN</p><p id="tv-kpi-open" class="text-5xl">0</p></div>
                    <div class="text-center"><p class="text-[12px] text-red-500 mb-1">KRITISCH</p><p id="tv-kpi-error" class="text-5xl text-red-500">0</p></div>
                </div>
            </div>
            
            <button id="btn-voice-test" onclick="runAcousticTest()" class="flex items-center gap-4 px-10 py-5 border-4 border-emerald-500/20 rounded-[30px] hover:border-emerald-500 transition-all group">
                <i data-lucide="radio" class="w-8 h-8 group-hover:animate-pulse text-emerald-500"></i>
                <span id="voice-test-text" class="text-lg font-black uppercase tracking-widest text-emerald-500">Akustik-Check</span>
            </button>

            <div id="tv-clock" class="text-6xl font-mono font-black tracking-tighter">00:00:00</div>
        </div>
        <div id="tv-grid" class="grid flex-grow auto-rows-max overflow-y-auto pt-4"></div>
    </main>

    <!-- TABLET -->
    <main id="view-tablet" class="hidden flex-grow p-4 flex flex-col space-y-4">
        <div class="bg-white dark:bg-zinc-950 p-5 rounded-3xl border border-slate-200 dark:border-zinc-800 flex justify-between items-center shadow-md">
            <h2 class="font-black text-lg uppercase flex items-center gap-3"><i data-lucide="tablet" class="text-brand-500"></i> Scanner</h2>
            <div class="tablet-clock font-mono text-sm font-bold text-slate-400 italic">00:00:00</div>
        </div>
        <!-- Die Grid-Spaltenanzahl wird jetzt dynamisch über CSS-Variablen gelöst -->
        <div id="tablet-grid" class="grid gap-6 flex-grow auto-rows-max" style="grid-template-columns: repeat(var(--tablet-cols), minmax(0, 1fr));"></div>
    </main>

    <div id="toast-container" class="fixed bottom-8 right-8 z-[100] space-y-2"></div>

    <!-- SCHWEBENDER LAYOUT-ANPASSUNGSPANEL (DRAWER) -->
    <div id="layout-config-panel" class="fixed right-6 bottom-24 bg-white dark:bg-zinc-950 border border-slate-200 dark:border-zinc-800 rounded-3xl p-6 shadow-2xl z-50 w-80 hidden transition-all">
        <div class="flex items-center justify-between border-b border-slate-100 dark:border-zinc-900 pb-3 mb-4">
            <h3 class="text-xs font-black uppercase tracking-wider text-brand-500 flex items-center gap-2">
                <i data-lucide="sliders" class="w-4 h-4"></i> Display Kalibrierung
            </h3>
            <button onclick="toggleLayoutConfig()" class="text-slate-400 hover:text-slate-600 dark:hover:text-zinc-200">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        
        <!-- Controls für TV Hallen-Monitor -->
        <div id="layout-controls-tv" class="space-y-4 hidden">
            <div>
                <label class="text-[9px] font-black text-slate-400 block mb-1">ZEILEN-HÖHE (TV)</label>
                <div class="flex items-center gap-3">
                    <input type="range" id="scale-tv-height" min="50" max="250" value="85" class="w-full accent-brand-500">
                    <span id="scale-tv-height-val" class="text-xs font-mono font-bold w-12 text-right">85px</span>
                </div>
            </div>
            <div>
                <label class="text-[9px] font-black text-slate-400 block mb-1">SCHRIFTGRÖSSE (TV)</label>
                <div class="flex items-center gap-3">
                    <input type="range" id="scale-tv-font" min="50" max="200" value="100" class="w-full accent-brand-500">
                    <span id="scale-tv-font-val" class="text-xs font-mono font-bold w-12 text-right">100%</span>
                </div>
            </div>
        </div>

        <!-- Controls für Tablet-Ansicht -->
        <div id="layout-controls-tablet" class="space-y-4 hidden">
            <div>
                <label class="text-[9px] font-black text-slate-400 block mb-1">SPALTEN ANZAHL (TABLET)</label>
                <div class="flex items-center gap-3">
                    <input type="range" id="scale-tablet-cols" min="1" max="4" value="2" class="w-full accent-brand-500">
                    <span id="scale-tablet-cols-val" class="text-xs font-mono font-bold w-12 text-right">2 Sp.</span>
                </div>
            </div>
            <div>
                <label class="text-[9px] font-black text-slate-400 block mb-1">KARTEN-HÖHE (TABLET)</label>
                <div class="flex items-center gap-3">
                    <input type="range" id="scale-tablet-height" min="100" max="300" value="160" class="w-full accent-brand-500">
                    <span id="scale-tablet-height-val" class="text-xs font-mono font-bold w-12 text-right">160px</span>
                </div>
            </div>
            <div>
                <label class="text-[9px] font-black text-slate-400 block mb-1">SCHRIFTGRÖSSE (TABLET)</label>
                <div class="flex items-center gap-3">
                    <input type="range" id="scale-tablet-font" min="50" max="200" value="100" class="w-full accent-brand-500">
                    <span id="scale-tablet-font-val" class="text-xs font-mono font-bold w-12 text-right">100%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Schwebender Trigger Button für die Kalibrierung (nur sichtbar in TV/Tablet Ansichten) -->
    <button id="btn-layout-toggle" onclick="toggleLayoutConfig()" class="fixed right-6 bottom-6 bg-brand-600 hover:bg-brand-700 text-white rounded-full p-4 shadow-2xl z-50 border-4 border-slate-50 dark:border-black hidden hover:scale-105 active:scale-95 transition-all">
        <i data-lucide="sliders" class="w-6 h-6"></i>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmwKHhJ6df7yOoR_LPUvc5PD6-Shvs9t8",
            authDomain: "auslagerungsauftraege.firebaseapp.com",
            projectId: "auslagerungsauftraege",
            storageBucket: "auslagerungsauftraege.firebasestorage.app",
            messagingSenderId: "135148773877",
            appId: "1:135148773877:web:9bed592472c82e20b140bc"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ordersCol = collection(db, "orders");

        let orders = [];
        let view = 'operator';
        let archiveDate = new Date().toISOString().split('T')[0];
        
        let voiceSettings = JSON.parse(localStorage.getItem('voice_v5')) || { active: true, name: '', interval: 2, reverb: 40 };
        let lastVoiceTime = Date.now() - (voiceSettings.interval * 60000) + 10000;

        // Display Layout Einstellungen aus LocalStorage laden
        let layoutSettings = JSON.parse(localStorage.getItem('layout_settings')) || {
            tvHeight: 85,
            tvFont: 100,
            tabletCols: 2,
            tabletHeight: 160,
            tabletFont: 100
        };

        // --- ACOUSTIC NEURAL ENGINE (NO MICROSOFT DEFAULT) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const synth = window.speechSynthesis;
        
        // Filter Chain
        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = "bandpass";
        bandpass.frequency.value = 1200; // Telefon/Intercom-Klang
        
        const reverbNode = audioCtx.createConvolver();
        function updateReverbBuffer() {
            const length = audioCtx.sampleRate * 1.5;
            const buffer = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
            const intensity = voiceSettings.reverb / 100;
            for (let i = 0; i < 2; i++) {
                const data = buffer.getChannelData(i);
                for (let j = 0; j < length; j++) {
                    data[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / length, 3) * intensity;
                }
            }
            reverbNode.buffer = buffer;
        }
        updateReverbBuffer();

        bandpass.connect(reverbNode);
        reverbNode.connect(audioCtx.destination);

        const introPhrases = ["Hallo Team,", "Achtung,", "Kurzer Hinweis,", "Entschuldigung,", "Guten Tag,"];
        const midPhrases = ["die Auslagerung für", "wir warten auf den Auftrag von", "bitte prüft den Auftrag um", "erledigt bitte den Auftrag von"];
        const endPhrases = ["Vielen Dank.", "Bitte sofort ausführen.", "Eilt sehr.", "Dankeschön."];

        function speakNatural(text, isTest = false) {
            if(!voiceSettings.active && !isTest) return;
            if(synth.speaking) return;

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const o1 = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o1.frequency.setValueAtTime(554.37, audioCtx.currentTime); // C#
            g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            
            o1.connect(g); 
            g.connect(bandpass); 
            o1.start(); 
            o1.stop(audioCtx.currentTime + 0.8);

            setTimeout(() => {
                const u = new SpeechSynthesisUtterance(text);
                const v = synth.getVoices().find(x => x.name === voiceSettings.name);
                if(v) u.voice = v;

                u.pitch = 0.95; 
                u.rate = 0.82; 

                u.onend = () => { if(isTest) { const btn = document.getElementById('btn-voice-test'); if(btn) btn.classList.remove('voice-active-ui'); } };
                synth.speak(u);
            }, 900);
        }

        function initVoices() {
            const vRaw = synth.getVoices().filter(v => v.lang.startsWith('de'));
            const sel = document.getElementById('voice-gender');
            if(sel) {
                vRaw.sort((a,b) => {
                    const aPrio = a.name.includes('Google') || a.name.includes('Neural') || a.name.includes('Natural');
                    const bPrio = b.name.includes('Google') || b.name.includes('Neural') || b.name.includes('Natural');
                    return bPrio - aPrio;
                });
                sel.innerHTML = vRaw.map(v => `<option value="${v.name}">${(v.name.includes('Google') || v.name.includes('Neural')) ? '⭐ NEURAL: ' : '💻 '} ${v.name}</option>`).join('');
                
                if(voiceSettings.name && vRaw.some(x => x.name === voiceSettings.name)) {
                    sel.value = voiceSettings.name;
                } else if(vRaw.length > 0) {
                    voiceSettings.name = vRaw[0].name;
                    sel.value = voiceSettings.name;
                }
            }
        }
        initVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = initVoices;

        // --- LAYOUT ENGINE (RESPONSIVITÄT & DISPLAY-KALIBRIERUNG) ---
        function applyLayoutSettings() {
            const root = document.documentElement;
            // CSS Custom Properties aktualisieren
            root.style.setProperty('--tv-card-height', `${layoutSettings.tvHeight}px`);
            root.style.setProperty('--tv-font-scale', layoutSettings.tvFont / 100);
            root.style.setProperty('--tablet-cols', layoutSettings.tabletCols);
            root.style.setProperty('--tablet-card-height', `${layoutSettings.tabletHeight}px`);
            root.style.setProperty('--tablet-font-scale', layoutSettings.tabletFont / 100);

            // Regler-Werte im Panel aktualisieren
            document.getElementById('scale-tv-height').value = layoutSettings.tvHeight;
            document.getElementById('scale-tv-height-val').textContent = `${layoutSettings.tvHeight}px`;
            document.getElementById('scale-tv-font').value = layoutSettings.tvFont;
            document.getElementById('scale-tv-font-val').textContent = `${layoutSettings.tvFont}%`;

            document.getElementById('scale-tablet-cols').value = layoutSettings.tabletCols;
            document.getElementById('scale-tablet-cols-val').textContent = `${layoutSettings.tabletCols} Sp.`;
            document.getElementById('scale-tablet-height').value = layoutSettings.tabletHeight;
            document.getElementById('scale-tablet-height-val').textContent = `${layoutSettings.tabletHeight}px`;
            document.getElementById('scale-tablet-font').value = layoutSettings.tabletFont;
            document.getElementById('scale-tablet-font-val').textContent = `${layoutSettings.tabletFont}%`;
        }

        function saveLayout() {
            localStorage.setItem('layout_settings', JSON.stringify(layoutSettings));
            applyLayoutSettings();
            if (view === 'tablet' || view === 'tv') {
                render();
            }
        }

        window.toggleLayoutConfig = () => {
            const panel = document.getElementById('layout-config-panel');
            panel.classList.toggle('hidden');
        };

        // Regler Event Listener
        document.getElementById('scale-tv-height').addEventListener('input', (e) => { layoutSettings.tvHeight = parseInt(e.target.value); saveLayout(); });
        document.getElementById('scale-tv-font').addEventListener('input', (e) => { layoutSettings.tvFont = parseInt(e.target.value); saveLayout(); });
        document.getElementById('scale-tablet-cols').addEventListener('input', (e) => { layoutSettings.tabletCols = parseInt(e.target.value); saveLayout(); });
        document.getElementById('scale-tablet-height').addEventListener('input', (e) => { layoutSettings.tabletHeight = parseInt(e.target.value); saveLayout(); });
        document.getElementById('scale-tablet-font').addEventListener('input', (e) => { layoutSettings.tabletFont = parseInt(e.target.value); saveLayout(); });

        // --- UI ACTIONS ---
        window.runAcousticTest = () => {
            const btn = document.getElementById('btn-voice-test');
            if(btn) btn.classList.add('voice-active-ui');
            const msg = "Achtung. Dies ist ein Test des neuronalen Durchsagesystems. Die akustische Übertragung in der Halle ist nun aktiv.";
            speakNatural(msg, true);
        };

        window.setViewMode = (mode) => {
            view = mode;
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById(`view-${mode}`).classList.remove('hidden');
            document.querySelectorAll('nav button').forEach(b => {
                const active = b.id === `btn-mode-${mode}`;
                b.className = `px-5 py-2 rounded-lg text-xs font-black uppercase transition-all ${active ? 'bg-brand-600 text-white shadow-xl' : 'text-slate-500 hover:bg-slate-200 dark:hover:bg-zinc-800'}`;
            });

            // Layout Einstellungs-Trigger basierend auf der Ansicht ein-/ausblenden
            const btnToggle = document.getElementById('btn-layout-toggle');
            const panel = document.getElementById('layout-config-panel');
            if (mode === 'tv' || mode === 'tablet') {
                btnToggle.classList.remove('hidden');
                document.getElementById('layout-controls-tv').classList.toggle('hidden', mode !== 'tv');
                document.getElementById('layout-controls-tablet').classList.toggle('hidden', mode !== 'tablet');
            } else {
                btnToggle.classList.add('hidden');
                panel.classList.add('hidden');
            }

            render();
            lucide.createIcons();
        };

        window.cycleStatus = async (id, cur) => {
            const ref = doc(db, "orders", id);
            let next = cur === 0 ? { status: 1, finishedAt: Timestamp.now() } : 
                       cur === 1 ? { status: 2, finishedAt: null } : { status: 0 };
            await updateDoc(ref, next);
        };

        // --- RENDER ENGINE ---
        function render() {
            const now = new Date();
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const active = orders.filter(o => o.status !== 1).sort((a,b) => {
                if(a.status === 2 && b.status !== 2) return -1;
                const minA = (a.uhrzeit.split(':')[0]*60) + (a.uhrzeit.split(':')[1]*1);
                const minB = (b.uhrzeit.split(':')[0]*60) + (b.uhrzeit.split(':')[1]*1);
                return minA - minB;
            });
            const archived = orders.filter(o => o.status === 1 && o.finishedAt?.toDate().toISOString().split('T')[0] === archiveDate);

            if(view === 'operator') renderOperator(active, archived, nowMin);
            if(view === 'tv') renderTV(active, nowMin);
            if(view === 'tablet') renderTablet(active);

            // DURCHSAGE LOGIK
            const overdue = active.filter(o => o.status === 0 && ((o.uhrzeit.split(':')[0]*60) + (o.uhrzeit.split(':')[1]*1)) < nowMin);
            if(overdue.length > 0 && (Date.now() - lastVoiceTime > voiceSettings.interval * 60000)) {
                const i = introPhrases[Math.floor(Math.random()*introPhrases.length)];
                const m = midPhrases[Math.floor(Math.random()*midPhrases.length)];
                const e = endPhrases[Math.floor(Math.random()*endPhrases.length)];
                
                let msg = overdue.length === 1 
                    ? `${i} ${m} ${overdue[0].uhrzeit} Uhr ist überfällig. ${e}` 
                    : `${i} es liegen mehrere überfällige Auslagerungen vor. Bitte Warteschlange prüfen. ${e}`;
                
                speakNatural(msg);
                lastVoiceTime = Date.now();
            }

            if(document.getElementById('tv-kpi-open')) document.getElementById('tv-kpi-open').textContent = active.filter(o => o.status === 0).length;
            if(document.getElementById('tv-kpi-error')) document.getElementById('tv-kpi-error').textContent = active.filter(o => o.status === 2).length;
            lucide.createIcons();
        }

        function renderOperator(active, archived, nowMin) {
            document.getElementById('table-active').innerHTML = active.map(o => {
                const isLate = ((o.uhrzeit.split(':')[0]*60) + (o.uhrzeit.split(':')[1]*1)) < nowMin;
                const urgentBadge = o.dringlich ? `<span class="ml-2 inline-flex items-center px-1.5 py-0.5 rounded-md text-[9px] font-black bg-red-600 text-white animate-pulse">EILT</span>` : '';
                return `
                <tr class="hover:bg-slate-50 dark:hover:bg-zinc-900 transition-colors ${o.status === 2 ? 'bg-red-50 dark:bg-red-900/10' : ''}">
                    <td class="px-6 py-4 font-black text-sm flex items-center">${esc(o.artikelnummer)}${urgentBadge}</td>
                    <td class="px-6 py-4 font-bold text-[10px] uppercase">${esc(o.lagerort)} ➔ ${esc(o.zielort)}</td>
                    <td class="px-6 py-4 font-mono text-sm ${isLate ? 'text-amber-500 font-bold' : ''}">${o.uhrzeit}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="cycleStatus('${o.id}', ${o.status})" class="p-2 bg-slate-100 dark:bg-zinc-800 rounded-lg hover:bg-emerald-500 hover:text-white transition-all"><i data-lucide="check" class="w-4 h-4"></i></button>
                    </td>
                </tr>`;
            }).join('');
            document.getElementById('table-archive').innerHTML = archived.map(o => `
                <tr class="opacity-30">
                    <td class="px-6 py-2 font-bold">${esc(o.artikelnummer)}</td>
                    <td class="px-6 py-2 uppercase text-[9px] font-bold">${esc(o.lagerort)} ➔ ${esc(o.zielort)}</td>
                    <td class="px-6 py-2 text-right"><button onclick="cycleStatus('${o.id}', 1)" class="hover:text-emerald-500"><i data-lucide="rotate-ccw" class="w-3 h-3"></i></button></td>
                </tr>`).join('');
        }

        function renderTV(active, nowMin) {
            document.getElementById('tv-grid').innerHTML = active.map(o => {
                const isLate = ((o.uhrzeit.split(':')[0]*60) + (o.uhrzeit.split(':')[1]*1)) < nowMin;
                const urgentBadge = o.dringlich ? `<span class="px-3 py-1 bg-red-600 text-white text-xs font-black rounded-lg animate-pulse mr-4">EILT</span>` : '';
                return `
                <!-- Proportionale Skalierung mittels Inline-Styles auf Basis von CSS Custom Properties -->
                <div class="tv-card-row flex items-center border-4 rounded-[25px] bg-white dark:bg-zinc-950 pr-10 shadow-lg mb-4 ${o.status === 2 ? 'border-red-500 glow-error' : o.dringlich ? 'border-red-700/60' : 'border-slate-100 dark:border-zinc-900'}" style="height: var(--tv-card-height) !important;">
                    <div class="w-4 h-full ${o.status === 2 ? 'bg-red-500' : o.dringlich ? 'bg-red-600' : isLate ? 'bg-amber-500' : 'bg-slate-300'}"></div>
                    <div class="flex-grow flex items-center justify-between pl-10 font-black" style="font-size: calc(1rem * var(--tv-font-scale));">
                        <div class="text-[2.25em] font-mono flex items-center">${urgentBadge}${esc(o.artikelnummer)}</div>
                        <div class="flex items-center gap-6 text-[1.5em] uppercase"><span class="text-slate-400">${esc(o.lagerort)}</span><i data-lucide="radio" class="w-[1.25em] h-[1.25em] text-emerald-500"></i><span>${esc(o.zielort)}</span></div>
                        <div class="text-right text-[2.25em] font-mono ${isLate ? 'text-amber-500' : ''}">${o.uhrzeit}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderTablet(active) {
            // Berechne die Barcode-Dimensionen dynamisch basierend auf der benutzerdefinierten Höhe
            const bcHeight = Math.max(35, Math.min(100, Math.round(layoutSettings.tabletHeight * 0.35)));
            const bcFontSize = Math.max(10, Math.min(20, Math.round(14 * (layoutSettings.tabletFont / 100))));

            document.getElementById('tablet-grid').innerHTML = active.map(o => {
                const borderClass = o.status === 2 ? 'border-red-500' : o.dringlich ? 'border-red-600/70 bg-red-50/10 dark:bg-red-950/20' : 'border-slate-100 dark:border-zinc-900';
                return `
                <div class="bg-white dark:bg-zinc-950 border-2 ${borderClass} p-5 rounded-[40px] flex items-center justify-between shadow-sm relative overflow-hidden" style="height: var(--tablet-card-height); font-size: calc(1rem * var(--tablet-font-scale));">
                    ${o.dringlich ? `<div class="absolute top-0 right-0 bg-red-600 text-white text-[8px] font-black px-3 py-0.5 rounded-bl-xl uppercase tracking-widest animate-pulse">EILT</div>` : ''}
                    <div class="bg-white p-3 rounded-2xl border shrink-0 flex items-center justify-center h-[80%] max-h-[140px]">
                        <svg class="bc-svg" data-val="${o.artikelnummer}"></svg>
                    </div>
                    <div class="text-center flex-grow px-2 font-black">
                        <p class="text-[1.25em] uppercase tracking-tighter leading-none">${esc(o.lagerort)} ➔ ${esc(o.zielort)}</p>
                        <p class="text-[0.75em] text-slate-400 mt-2 uppercase font-bold tracking-widest leading-none">${o.uhrzeit} UHR</p>
                    </div>
                    <button onclick="cycleStatus('${o.id}', ${o.status})" class="w-[6em] h-[6em] max-w-[90px] max-h-[90px] bg-emerald-500 text-white rounded-[35px] flex items-center justify-center shadow-lg active:scale-95 transition-all">
                        <i data-lucide="check" class="w-[3em] h-[3em] stroke-[4]"></i>
                    </button>
                </div>`;
            }).join('');
            
            // Barcodes mit den skalierten Dimensionen rendern
            document.querySelectorAll('.bc-svg').forEach(el => {
                JsBarcode(el, el.getAttribute('data-val'), { 
                    format: "CODE128", 
                    width: 2, 
                    height: bcHeight, 
                    displayValue: true, 
                    fontSize: bcFontSize 
                });
            });
        }

        // --- CORE FUNCTIONS ---
        function initTime() {
            const n = new Date();
            document.getElementById('uhrzeit').value = `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
            document.getElementById('archive-date-filter').value = archiveDate;
        }

        onSnapshot(query(ordersCol, orderBy("createdAt", "desc")), (snap) => {
            orders = []; snap.forEach(d => orders.push({ id: d.id, ...d.data() }));
            render();
        });

        document.getElementById('auftrag-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            try {
                await addDoc(ordersCol, {
                    artikelnummer: document.getElementById('artikelnummer').value.trim(),
                    lagerort: document.getElementById('lagerort').value.trim().toUpperCase(),
                    zielort: document.getElementById('zielort').value.trim().toUpperCase(),
                    uhrzeit: document.getElementById('uhrzeit').value,
                    schicht: document.getElementById('schicht').value,
                    dringlich: document.getElementById('dringlich').checked,
                    status: 0, 
                    createdAt: Timestamp.now()
                });
                e.target.reset(); 
                initTime();
            } catch (err) { 
                console.error(err);
                alert("Senden fehlgeschlagen!"); 
            }
            btn.disabled = false;
        });

        document.getElementById('voice-active').addEventListener('change', (e) => { voiceSettings.active = e.target.checked; saveV(); });
        document.getElementById('voice-gender').addEventListener('change', (e) => { voiceSettings.name = e.target.value; saveV(); speakNatural("KI-Stimme aktiviert.", true); });
        document.getElementById('voice-reverb').addEventListener('input', (e) => { voiceSettings.reverb = e.target.value; updateReverbBuffer(); saveV(); });
        document.getElementById('voice-interval').addEventListener('change', (e) => { voiceSettings.interval = e.target.value; saveV(); });
        function saveV() { localStorage.setItem('voice_v5', JSON.stringify(voiceSettings)); }
        document.getElementById('archive-date-filter').addEventListener('change', (e) => { archiveDate = e.target.value; render(); });

        function esc(t) { 
            if (t === undefined || t === null) return '';
            const d = document.createElement('div'); 
            d.textContent = t; 
            return d.innerHTML; 
        }

        setInterval(() => {
            const t = new Date().toLocaleTimeString('de-DE');
            ['live-clock-operator', 'tv-clock', '.tablet-clock'].forEach(s => {
                const el = s.startsWith('.') ? document.querySelector(s) : document.getElementById(s);
                if(el) el.textContent = t;
            });
            if(new Date().getSeconds() === 0) render();
        }, 1000);

        // System initialisieren
        applyLayoutSettings();
        initTime();
        setViewMode('operator');
    </script>
</body>
</html>
